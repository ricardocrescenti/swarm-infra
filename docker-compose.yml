# =============================================================================
# Swarm Infrastructure - Stack Base Compartilhada
# =============================================================================
# Deploy: ./deploy.sh
# Remove: ./remove.sh
# =============================================================================

version: '3.8'

# =============================================================================
# Networks - Compartilhada entre todas as aplicações
# =============================================================================
networks:
  traefik_public:
    driver: overlay
    attachable: true

# =============================================================================
# Volumes
# =============================================================================
volumes:
  traefik_letsencrypt:
    driver: local

  portainer_data:
    driver: local

# =============================================================================
# Services
# =============================================================================
services:
  # ---------------------------------------------------------------------------
  # Traefik - Reverse Proxy e Load Balancer
  # ---------------------------------------------------------------------------
  traefik:
    image: traefik:v2.11
    command:
      - --api.dashboard=true
      - --api.insecure=false
      - --providers.docker=true
      - --providers.docker.swarmMode=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=traefik_public
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.letsencrypt.acme.email=${LETSENCRYPT_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --log.level=INFO
      - --accesslog=true
    ports:
      - target: 80
        published: 80
        mode: host
      - target: 443
        published: 443
        mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_letsencrypt:/letsencrypt
    networks:
      - traefik_public
    deploy:
      mode: global
      placement:
        constraints:
          - node.role == manager
      labels:
        - traefik.enable=true
        - traefik.http.routers.traefik.rule=Host(`traefik.${DOMAIN}`)
        - traefik.http.routers.traefik.service=api@internal
        - traefik.http.routers.traefik.entrypoints=websecure
        - traefik.http.routers.traefik.tls.certresolver=letsencrypt
        - traefik.http.services.traefik.loadbalancer.server.port=8080
        - traefik.http.routers.traefik.middlewares=auth
        - traefik.http.middlewares.auth.basicauth.users=${TRAEFIK_AUTH}

  # ---------------------------------------------------------------------------
  # Portainer - Interface Web para Docker Swarm
  # Conectado ao Docker daemon local da VM via docker.sock
  # Versão fixa para evitar breaking changes (atualize conforme necessário)
  # Verificar versões: https://hub.docker.com/r/portainer/portainer-ce/tags
  # ---------------------------------------------------------------------------
  portainer:
    image: portainer/portainer-ce:2.38.1
    
    command:
      - --admin-password=${PORTAINER_ADMIN_PASSWORD}

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    
    networks:
      - traefik_public
    
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      update_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      labels:
        # Habilitar Traefik
        - traefik.enable=true
        
        # Router HTTP → HTTPS
        - traefik.http.routers.portainer-http.rule=Host(`portainer.${DOMAIN}`)
        - traefik.http.routers.portainer-http.entrypoints=web
        - traefik.http.routers.portainer-http.middlewares=portainer-https-redirect
        
        # Middleware de redirecionamento
        - traefik.http.middlewares.portainer-https-redirect.redirectscheme.scheme=https
        - traefik.http.middlewares.portainer-https-redirect.redirectscheme.permanent=true
        
        # Router HTTPS
        - traefik.http.routers.portainer-https.rule=Host(`portainer.${DOMAIN}`)
        - traefik.http.routers.portainer-https.entrypoints=websecure
        - traefik.http.routers.portainer-https.tls=true
        - traefik.http.routers.portainer-https.tls.certresolver=letsencrypt
        - traefik.http.routers.portainer-https.service=portainer
        
        # Service
        - traefik.http.services.portainer.loadbalancer.server.port=9000
        
        # Headers de segurança
        - traefik.http.routers.portainer-https.middlewares=portainer-headers
        - traefik.http.middlewares.portainer-headers.headers.sslredirect=true
        - traefik.http.middlewares.portainer-headers.headers.stsSeconds=31536000
        - traefik.http.middlewares.portainer-headers.headers.stsIncludeSubdomains=true
        - traefik.http.middlewares.portainer-headers.headers.stsPreload=true
